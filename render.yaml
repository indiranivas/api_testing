services:
  - type: web
    name: telemetry-system
    runtime: python39
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 3 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./telemetry.db
      - key: DEBUG
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
